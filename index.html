<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BugText</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body class="view-split">
    <div id="app">
      <div class="workbench">
        <nav id="activitybar" aria-label="Primary">
          <button
            class="ab-btn ab-explorer active"
            id="ab-explorer"
            title="Explorer"
            type="button"
            aria-label="Toggle Explorer"
            aria-pressed="true"
          ></button>
          <button class="ab-btn ab-outline" id="ab-outline" title="Outline" type="button" aria-label="Outline" aria-pressed="false"></button>
          <button
            class="ab-btn ab-search"
            id="ab-search"
            title="Find in Folder (⌘⇧F)"
            type="button"
            aria-label="Search files and commands"
          ></button>
          <button
            class="ab-btn ab-ai"
            id="ab-ai"
            title="AI"
            type="button"
            aria-label="Toggle AI panel"
            aria-pressed="false"
          ></button>
          <button
            class="ab-btn ab-export"
            id="ab-export"
            title="Export"
            type="button"
            aria-label="Export document"
          ></button>
          <button
            class="ab-btn ab-settings"
            id="ab-settings"
            title="Settings"
            type="button"
            aria-label="Open settings"
          ></button>
        </nav>

        <aside id="outline-panel" aria-label="Outline" hidden></aside>
        <aside id="explorer" aria-label="Explorer">
          <div class="explorer-title">
            <span>EXPLORER</span>
            <button id="ex-more" class="ex-icon" type="button" title="More actions" aria-label="More actions"></button>
          </div>
          <header class="explorer-header">
            <button id="ex-root" class="explorer-root" type="button" aria-expanded="true">
              <span class="explorer-caret"></span>
              <span id="explorer-folder-name">No folder</span>
            </button>
            <div class="explorer-actions">
              <button id="ex-new-file" class="ex-icon" type="button" title="New File"></button>
              <button id="ex-new-folder" class="ex-icon" type="button" title="New Folder"></button>
              <button id="ex-refresh" class="ex-icon" type="button" title="Refresh"></button>
              <button id="ex-collapse" class="ex-icon" type="button" title="Collapse All"></button>
            </div>
          </header>
          <div id="explorer-tree" class="explorer-tree" role="tree"></div>
          <div id="explorer-empty-folder" hidden></div>
          <div id="explorer-empty" class="explorer-empty">
            <p>Open a folder to browse its files.</p>
            <button id="explorer-empty-open" type="button">Open Folder <kbd id="explorer-open-folder-hint"></kbd></button>
            <button id="explorer-empty-open-file" type="button">Open File… <kbd id="explorer-open-file-hint"></kbd></button>
          </div>
        </aside>

        <aside id="search-panel" aria-label="Search" hidden></aside>

        <aside id="settings-rail" aria-label="Settings" hidden></aside>

        <div id="explorer-resize" class="resize-handle" aria-hidden="true"></div>

        <section id="editorarea">
          <div id="windows" class="windows"></div>
          <div id="agent-notices" aria-live="polite"></div>
        </section>

        <main id="settings-pane" aria-label="Settings" hidden></main>

        <div id="ai-resize" class="resize-handle ai-resize" aria-hidden="true"></div>
        <aside id="ai-panel" aria-label="AI">
          <div class="ai-header">
            <strong>Chat</strong>
            <button
              class="ai-close"
              id="ai-close"
              type="button"
              title="Hide AI panel"
              aria-label="Hide AI panel"
            >×</button>
          </div>
          <div class="ai-body"></div>
        </aside>
      </div>

    </div>
  </body>
</html>
