<!doctype html><html lang="en"><meta charset="utf-8"><title>Table view mockup</title><style>
body{font:15px system-ui;background:#f5f5f2;color:#252923;margin:40px}body.dark{background:#202420;color:#e6e9e2}button{font:inherit;padding:8px;background:transparent;color:inherit;border:1px solid #888;border-radius:5px;cursor:pointer}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{text-align:left;padding:14px;border-bottom:1px solid #888}tr:focus,tr:hover{background:#87967644}small{opacity:.65}aside{margin-bottom:24px}</style>
<aside>Filter · #project <button onclick="document.querySelector('main').hidden=false">Table view</button> <button onclick="document.body.classList.toggle('dark')">Light / dark</button></aside><main><h2>Table: Notes</h2><small>3 matching notes · Read only · ↑ ↓ select, Enter open</small><table><thead><tr><th><button onclick="let b=document.querySelector('tbody');b.append(...Array.from(b.rows).reverse())">Title ↕</button></th><th>Path</th><th>Tags</th><th>status</th><th>date</th><th class="extra" hidden>priority</th></tr></thead><tbody></tbody></table><button onclick="document.querySelectorAll('.extra').forEach(e=>e.hidden=false);this.hidden=true">More columns</button><p role="status"></p></main><script>
for(const [name,date] of [['Launch','2026-10-29'],['Review','2026-11-01'],['Research','2026-11-02']]){const tr=document.createElement('tr');tr.tabIndex=0;for(const text of [name,name+'.md','project','active',date,'2']){const td=document.createElement('td');td.textContent=text;if(text==='2'){td.className='extra';td.hidden=true}tr.append(td)}tr.onclick=()=>document.querySelector('[role=status]').textContent='Open '+name+' at line 1';tr.onkeydown=e=>{if(e.key==='Enter')tr.click();if(e.key==='ArrowDown')tr.nextElementSibling?.focus();if(e.key==='ArrowUp')tr.previousElementSibling?.focus()};document.querySelector('tbody').append(tr)}
</script></html>
